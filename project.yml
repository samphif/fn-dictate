name: FnDictate
options:
  bundleIdPrefix: com.samuelphifer
  deploymentTarget:
    macOS: "26.0"
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  FnDictate:
    type: application
    platform: macOS
    sources:
      - path: FnDictate
        excludes:
          - Resources/Info.plist
          - Resources/*.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samuelphifer.FnDictate
      PRODUCT_NAME: FnDictate
      INFOPLIST_FILE: FnDictate/Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: FnDictate/Resources/FnDictate.entitlements
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
